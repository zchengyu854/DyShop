# 开发环境配置 —— 请按本机 MySQL 实际账号密码修改
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dyshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

dyshop:
  jwt:
    # HS256 密钥，长度须 >= 32 字节；生产环境务必更换并从环境变量注入
    secret: dyshop-dev-secret-change-me-0123456789abcdef
    expire-hours: 24
    header: Authorization
    prefix: "Bearer "
